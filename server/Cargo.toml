[package]
name = "linkedin-challenge-server"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "linkedin-challenge-server"

[[bin]]
name = "linkedin-challenge-server"
path = "src/main.rs"

# The Vercel function entry generated by create-nextrs-app.
[[bin]]
name = "index"
path = "api/index.rs"

[[bin]]
name = "dump-openapi"
path = "src/bin/dump-openapi.rs"

[build-dependencies]
nextrs = { git = "https://github.com/drewhirschi/nextrs.git", rev = "e0cb679", features = [
    "build",
    "tsx",
] }

[dependencies]
nextrs = { git = "https://github.com/drewhirschi/nextrs.git", rev = "e0cb679", features = [
    "vercel",
] }
# Toasty with the `turso` driver = libsql. Local file now (`turso:linkedin.db`), hosted Turso later.
toasty = { version = "0.7", features = ["turso"] }
axum = "0.8"
http = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tower-livereload = "0.9"
vercel_runtime = { version = "2", features = ["axum"] }
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
utoipa = "5"
rand = "0.8"
argon2 = "0.5"
