name: Build extension release

on:
  push:
    tags:
      - "extension-v*"
  workflow_dispatch:
    inputs:
      server_url:
        description: Production HTTPS origin baked into the extension
        required: true
        default: https://linkedin-challenge-ruby.vercel.app
        type: string
      tag:
        description: Release tag; must match extension-v<manifest version>
        required: true
        default: extension-v0.1.0
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build verified extension zip
        env:
          EXTENSION_SERVER_URL: ${{ inputs.server_url || 'https://linkedin-challenge-ruby.vercel.app' }}
        run: |
          [[ "$EXTENSION_SERVER_URL" == https://* ]] || {
            echo "server_url must be a production HTTPS origin" >&2
            exit 1
          }
          ./extension/build.sh "$EXTENSION_SERVER_URL"

      - name: Record and validate build details
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("extension/dist/unpacked/manifest.json").read_text())
          version = manifest["version"]
          expected_tag = f"extension-v{version}"
          requested_tag = os.environ["REQUESTED_TAG"]
          if requested_tag != expected_tag:
              raise SystemExit(f"release tag {requested_tag!r} must equal {expected_tag!r}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\n")
              output.write(f"tag={requested_tag}\n")
          print(f"version={version}")
          print(f"tag={requested_tag}")
          print("host_permissions=" + ",".join(manifest["host_permissions"]))
          PY
          version=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          cd extension/dist
          sha256sum challenge-sync-*.zip > "challenge-sync-${version}.sha256"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: challenge-sync-extension-${{ github.sha }}
          path: |
            extension/dist/challenge-sync-*.zip
            extension/dist/challenge-sync-*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          assets=(
            "extension/dist/challenge-sync-${RELEASE_VERSION}.zip"
            "extension/dist/challenge-sync-${RELEASE_VERSION}.sha256"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Challenge Sync ${RELEASE_VERSION}" \
              --generate-notes
          fi
